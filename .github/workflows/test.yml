name: Build quickshell-git (x86-64-v3)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */23 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Update system
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl sudo

      - name: Setup CachyOS repo
        run: |
          pacman-key --init
          curl -L https://mirror.cachyos.org/cachyos-repo.tar.xz -o repo.tar.xz
          tar -xf repo.tar.xz
          cd cachyos-repo
          chmod +x cachyos-repo.sh
          yes | ./cachyos-repo.sh
          pacman -Syu --noconfirm

      - name: Install dependencies
        run: |
          pacman -S --noconfirm \
            cmake ninja cli11 qt6-base qt6-declarative qt6-svg \
            qt6-wayland qt6-shadertools spirv-tools wayland-protocols \
            jemalloc libdrm libglvnd libpipewire libxcb mesa pam polkit

      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Build cpptrace (AUR)
        run: |
          chown -R builder:builder /home/builder
          su builder -c "
            cd ~ &&
            git clone https://aur.archlinux.org/cpptrace.git &&
            cd cpptrace &&
            makepkg -si --noconfirm
          "

      - name: Create PKGBUILD
        run: |
          cat << 'EOF' > /home/builder/PKGBUILD
          pkgname=quickshell-git
          pkgver=0.0.0
          pkgrel=1
          pkgdesc="Flexible toolkit for making desktop shells with QtQuick"
          arch=(x86_64)
          url="https://git.outfoxxed.me/quickshell/quickshell"
          license=(LGPL-3.0-only)

          depends=(
            gcc-libs
            glibc
            hicolor-icon-theme
            jemalloc
            libdrm
            libglvnd
            libpipewire
            libxcb
            mesa
            pam
            qt6-base
            qt6-declarative
            qt6-svg
            qt6-wayland
            wayland
          )

          makedepends=(
            cli11
            cmake
            ninja
            qt6-shadertools
            spirv-tools
            wayland-protocols
            git
            cpptrace
          )

          source=("git+https://git.outfoxxed.me/quickshell/quickshell.git")
          sha256sums=('SKIP')

          pkgver() {
            cd quickshell
            # Fallback for when there are no git tags
            git describe --long --tags --abbrev=7 2>/dev/null | sed 's/^v//;s/-/.r/;s/-/./' || printf "r%s.%s" "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)"
          }

          build() {
            cd quickshell

            export CFLAGS="-O2 -pipe -march=x86-64-v3"
            export CXXFLAGS="-O2 -pipe -march=x86-64-v3"

            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DINSTALL_QML_PREFIX=lib/qt6/qml

            cmake --build build
          }

          package() {
            cd quickshell
            DESTDIR="$pkgdir" cmake --install build
          }
          EOF

      - name: Build package
        run: |
          chown -R builder:builder /home/builder
          su builder -c "cd ~ && makepkg -s --noconfirm"

      - name: Prepare release
        id: pkg
        run: |
          # Specifically target the quickshell-git package to avoid conflicts
          PKG_PATH=$(ls /home/builder/quickshell-git-*.pkg.tar.zst | head -n 1)
          PKG_FILE=$(basename "$PKG_PATH")
          VERSION=$(echo "$PKG_FILE" | sed -E 's/^quickshell-git-(.*)-x86_64\.pkg\.tar\.zst/\1/')

          mkdir release
          cp "$PKG_PATH" "release/quickshell-git-${VERSION}-x86_64_v3.pkg.tar.zst"

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickshell-git-${{ steps.pkg.outputs.version }}-x86_64_v3
          path: release/*.pkg.tar.zst

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}-v3
          name: quickshell-git ${{ steps.pkg.outputs.version }} (x86-64-v3)
          files: release/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
