name: Build quickshell-git (x86-64-v3)

permissions:
contents: write

on:
workflow_dispatch:
schedule:
- cron: "0 */23 * * *"

jobs:
build:
runs-on: ubuntu-latest
container:
image: archlinux:latest

```
steps:

  # -------------------------
  # Update system
  # -------------------------
  - name: Update base system
    run: |
      pacman -Syu --noconfirm
      pacman -S --noconfirm base-devel git curl sudo

  # -------------------------
  # Init pacman keys
  # -------------------------
  - name: Initialize pacman keys
    run: |
      pacman-key --init
      pacman-key --populate archlinux

  # -------------------------
  # Add CachyOS repo
  # -------------------------
  - name: Setup CachyOS repo
    run: |
      curl -L https://mirror.cachyos.org/cachyos-repo.tar.xz -o cachyos-repo.tar.xz
      tar -xf cachyos-repo.tar.xz
      cd cachyos-repo
      chmod +x cachyos-repo.sh
      yes | ./cachyos-repo.sh
      pacman -Syu --noconfirm
      pacman -S --noconfirm paru

  # -------------------------
  # Create builder user
  # -------------------------
  - name: Create builder user
    run: |
      useradd -m builder
      echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

  # -------------------------
  # Install repo dependencies
  # -------------------------
  - name: Install repo dependencies
    run: |
      pacman -S --noconfirm \
        cmake ninja cli11 qt6-base qt6-declarative qt6-svg qt6-wayland \
        qt6-shadertools spirv-tools wayland-protocols jemalloc \
        libdrm libglvnd libpipewire libxcb mesa pam polkit

  # -------------------------
  # Install cpptrace from AUR
  # -------------------------
  - name: Install cpptrace
    run: |
      chown -R builder:builder /home/builder
      su - builder -c "paru -S --noconfirm --needed cpptrace"

  # -------------------------
  # Create build directory
  # -------------------------
  - name: Create PKGBUILD
    run: |
      mkdir -p /home/builder/build
      cat > /home/builder/build/PKGBUILD << 'EOF'
      pkgname=quickshell-git
      pkgver=0.0.0
      pkgrel=1
      pkgdesc="Flexible toolkit for making desktop shells with QtQuick (git, x86-64-v3)"
      arch=(x86_64)
      url="https://git.outfoxxed.me/quickshell/quickshell"
      license=(LGPL-3.0-only)

      depends=(
        gcc-libs glibc hicolor-icon-theme jemalloc libdrm libglvnd
        libpipewire libxcb mesa pam qt6-base qt6-declarative
        qt6-svg qt6-wayland wayland
      )

      makedepends=(
        cli11 cmake ninja qt6-shadertools spirv-tools
        wayland-protocols git cpptrace
      )

      provides=(quickshell)
      conflicts=(quickshell)

      source=("git+https://git.outfoxxed.me/quickshell/quickshell.git")
      sha256sums=('SKIP')

      pkgver() {
        cd quickshell
        git describe --long --tags --abbrev=7 | sed 's/^v//;s/-/.r/;s/-/./'
      }

      build() {
        cd quickshell

        export CFLAGS="-O2 -pipe -march=x86-64-v3 -mtune=generic"
        export CXXFLAGS="-O2 -pipe -march=x86-64-v3 -mtune=generic"

        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DINSTALL_QML_PREFIX=lib/qt6/qml

        cmake --build build
      }

      package() {
        cd quickshell
        DESTDIR="$pkgdir" cmake --install build

        strip --strip-all "$pkgdir/usr/bin/quickshell" || true

        install -Dm0644 LICENSE "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
      }
      EOF

  # -------------------------
  # Build package
  # -------------------------
  - name: Build package
    run: |
      chown -R builder:builder /home/builder
      su - builder -c "cd ~/build && makepkg -s --noconfirm"

  # -------------------------
  # Prepare release
  # -------------------------
  - name: Prepare release
    id: pkg
    run: |
      PKG_PATH=$(ls /home/builder/build/*.pkg.tar.zst)
      PKG_FILE=$(basename "$PKG_PATH")

      VERSION=$(echo "$PKG_FILE" | sed -E 's/^quickshell-git-(.*)-x86_64\.pkg\.tar\.zst/\1/')

      mkdir release
      cp "$PKG_PATH" "release/quickshell-git-${VERSION}-x86_64_v3.pkg.tar.zst"

      echo "version=$VERSION" >> $GITHUB_OUTPUT

  # -------------------------
  # Upload artifact
  # -------------------------
  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: quickshell-git-${{ steps.pkg.outputs.version }}-x86_64_v3
      path: release/*.pkg.tar.zst

  # -------------------------
  # Create GitHub Release
  # -------------------------
  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: ${{ steps.pkg.outputs.version }}-v3
      name: quickshell-git ${{ steps.pkg.outputs.version }} (x86-64-v3)
      files: release/*.pkg.tar.zst
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
