name: Build quickshell-git (Zen 3 Optimized)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */23 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update system & Setup CachyOS
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl sudo
          pacman-key --init
          curl -L https://mirror.cachyos.org/cachyos-repo.tar.xz -o repo.tar.xz
          tar -xf repo.tar.xz
          cd cachyos-repo
          chmod +x cachyos-repo.sh
          yes | ./cachyos-repo.sh
          pacman -Syu --noconfirm
          # Install mold for high-speed linking
          pacman -S --noconfirm mold

      - name: Install dependencies
        run: |
          pacman -S --noconfirm \
            cmake ninja cli11 qt6-base qt6-declarative qt6-svg \
            qt6-wayland qt6-shadertools spirv-tools wayland-protocols \
            jemalloc libdrm libglvnd libpipewire libxcb mesa pam polkit \
            vulkan-headers vulkan-icd-loader

      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /home/builder

      - name: Build cpptrace (AUR)
        run: |
          su builder -c "
            cd ~ &&
            git clone https://aur.archlinux.org/cpptrace.git &&
            cd cpptrace &&
            export CFLAGS='-O3 -march=znver3 -pipe'
            export CXXFLAGS='-O3 -march=znver3 -pipe'
            makepkg -s --noconfirm
          "

      - name: Install cpptrace
        run: |
          pacman -U --noconfirm /home/builder/cpptrace/*.pkg.tar.zst

      - name: Create quickshell PKGBUILD
        run: |
          cat << 'EOF' > /home/builder/PKGBUILD
          pkgname=quickshell-git
          pkgver=0.0.0
          pkgrel=1
          pkgdesc="Flexible toolkit for making desktop shells (Zen 3 + LTO)"
          arch=(x86_64)
          url="https://git.outfoxxed.me/quickshell/quickshell"
          license=(LGPL-3.0-only)

          depends=(cpptrace gcc-libs glibc hicolor-icon-theme jemalloc libdrm 
                   libglvnd libpipewire libxcb mesa pam qt6-base qt6-declarative 
                   qt6-svg qt6-wayland wayland)

          makedepends=(cli11 cmake ninja qt6-shadertools spirv-tools 
                       wayland-protocols git vulkan-headers mold)

          provides=(quickshell quickshell-git)
          conflicts=(quickshell)
          replaces=(quickshell)
          options=(!debug !lto)

          source=("git+https://git.outfoxxed.me/quickshell/quickshell.git")
          sha256sums=('SKIP')

          pkgver() {
            cd quickshell
            git describe --long --tags --abbrev=7 2>/dev/null | sed 's/^v//;s/-/.r/;s/-/./' || \
            printf "r%s.%s" "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)"
          }

          build() {
            cd quickshell

            # --- PERFORMANCE TUNING ---
            # Using -flto (GCC compatible) instead of -flto=thin (Clang only)
            export CFLAGS="-O3 -march=znver3 -flto -fno-plt -pipe"
            export CXXFLAGS="-O3 -march=znver3 -flto -fno-plt -pipe"
            export LDFLAGS="-Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now -flto -fuse-ld=mold"

            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DINSTALL_QML_PREFIX=lib/qt6/qml \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
              -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold" \
              -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=mold"

            cmake --build build
          }

          package() {
            cd quickshell
            DESTDIR="$pkgdir" cmake --install build
            # Strip for minimum size
            find "$pkgdir/usr/bin" -type f -exec strip --strip-all {} +
          }
          EOF
          chown builder:builder /home/builder/PKGBUILD

      - name: Build quickshell package
        run: |
          su builder -c "
            export MAKEFLAGS='-j$(nproc)'
            cd ~ && makepkg -s --noconfirm
          "

      - name: Prepare release files
        id: pkg
        run: |
          mkdir -p release
          # Extract version and rename package to reflect optimization
          PKG_PATH=$(ls /home/builder/quickshell-git-*.pkg.tar.zst | head -n1)
          VERSION=$(basename "$PKG_PATH" | sed -E 's/^quickshell-git-(.*)-x86_64\.pkg\.tar\.zst/\1/')
          
          NEW_NAME="quickshell-git-${VERSION}-znver3.pkg.tar.zst"
          cp "$PKG_PATH" "release/$NEW_NAME"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}-znver3
          name: quickshell-git ${{ steps.pkg.outputs.version }} (Zen 3 Optimized)
          files: release/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
