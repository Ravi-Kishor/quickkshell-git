name: Build quickshell-git (Zen3 Optimized)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Init system
        run: |
          pacman-key --init
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo clang lld

      - name: Enforce Zen3 + LTO globally
        run: |
          sed -i 's/-march=x86-64/-march=znver3 -mtune=znver3/g' /etc/makepkg.conf
          sed -i 's/-O2/-O2 -pipe -fomit-frame-pointer -fno-plt/g' /etc/makepkg.conf
          sed -i 's/^#MAKEFLAGS=.*/MAKEFLAGS="-j$(nproc)"/' /etc/makepkg.conf
          sed -i 's/^#LTOFLAGS=.*/LTOFLAGS="-flto=auto"/' /etc/makepkg.conf

          # switch to clang
          sed -i 's/^CC=.*/CC=clang/' /etc/makepkg.conf
          sed -i 's/^CXX=.*/CXX=clang++/' /etc/makepkg.conf
          sed -i 's/^#RUSTFLAGS=.*/RUSTFLAGS="-C target-cpu=znver3"/' /etc/makepkg.conf

      - name: Install dependencies
        run: |
          pacman -S --noconfirm \
            cmake ninja cli11 qt6-base qt6-declarative qt6-svg \
            qt6-wayland qt6-shadertools spirv-tools wayland-protocols \
            jemalloc libdrm libglvnd libpipewire libxcb mesa pam polkit \
            vulkan-headers

      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Build cpptrace (AUR)
        run: |
          chown -R builder:builder /home/builder
          su builder -c "
            cd ~ &&
            git clone https://aur.archlinux.org/cpptrace.git &&
            cd cpptrace &&
            makepkg -s --noconfirm --needed
          "

      - name: Install cpptrace
        run: |
          pacman -U --noconfirm /home/builder/cpptrace/*.pkg.tar.zst

      - name: Create PKGBUILD
        run: |
          cat << 'EOF' > /home/builder/PKGBUILD
          pkgname=quickshell-git
          pkgver=0.0.0
          pkgrel=1
          pkgdesc="Flexible toolkit for making desktop shells with QtQuick"
          arch=(x86_64)
          url="https://git.outfoxxed.me/quickshell/quickshell"
          license=(LGPL-3.0-only)

          provides=(quickshell quickshell-git)
          conflicts=(quickshell)

          depends=(
            cpptrace gcc-libs glibc hicolor-icon-theme jemalloc
            libdrm libglvnd libpipewire libxcb mesa pam
            qt6-base qt6-declarative qt6-svg qt6-wayland wayland
          )

          makedepends=(
            cli11 cmake ninja qt6-shadertools spirv-tools
            wayland-protocols git vulkan-headers
          )

          source=("git+https://git.outfoxxed.me/quickshell/quickshell.git")
          sha256sums=('SKIP')

          pkgver() {
            cd quickshell
            git describe --long --tags --abbrev=7 2>/dev/null \
              | sed 's/^v//;s/-/.r/;s/-/./' \
              || printf "r%s.%s" "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)"
          }

          build() {
            cd quickshell

            export CFLAGS="-O2 -march=znver3 -mtune=znver3 -pipe -fomit-frame-pointer -fno-plt"
            export CXXFLAGS="$CFLAGS"
            export LDFLAGS="-Wl,-O1,--as-needed"
            export CC=clang
            export CXX=clang++

            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_FLAGS="$CFLAGS" \
              -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DINSTALL_QML_PREFIX=lib/qt6/qml

            cmake --build build -j$(nproc)
          }

          package() {
            cd quickshell
            DESTDIR="$pkgdir" cmake --install build
          }
          EOF

      - name: Build package
        run: |
          chown -R builder:builder /home/builder
          su builder -c "
            export PACKAGER='Ravi Kishor <github@ravi>'
            cd ~ && makepkg -s --noconfirm --needed
          "

      - name: Prepare release
        id: pkg
        run: |
          mkdir release
          cp /home/builder/cpptrace/*.pkg.tar.zst release/
          cp /home/builder/quickshell-git-*.pkg.tar.zst release/

          VERSION=$(basename $(ls /home/builder/quickshell-git-*.pkg.tar.zst) | sed -E 's/^quickshell-git-(.*)-x86_64\.pkg\.tar\.zst/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickshell-zen3
          path: release/*.pkg.tar.zst

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}-zen3
          name: quickshell-git ${{ steps.pkg.outputs.version }} (Zen3 Optimized)
          files: release/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
